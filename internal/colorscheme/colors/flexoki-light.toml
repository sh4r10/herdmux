# flexoki-light: a herdmux colorscheme, hand-mapped from the theme's official palette.
# source: https://github.com/kepano/flexoki (README.md: base, 400 and 600 accents)
[colors]
pane_bg               = "#fffcf0"
bg                    = "#f2f0e5"
bg_raised             = "#dad8ce"
bg_overlay            = "#e6e4d9"
fg                    = "#100f0f"
fg_muted              = "#6f6e69"
fg_on_attention       = "#fffcf0"
border                = "#dad8ce"
border_active         = "#a02f6f"
accent                = "#a02f6f"
state_working         = "#ad8301"
state_needs_input     = "#af3029"
